name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding
          POSTGRES_DB: wedding
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wedding"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://wedding:wedding@localhost:5432/wedding
      REDIS_URL: redis://localhost:6379/0
      STORAGE_BACKEND: memory
      EMBEDDING_PROVIDER: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.8.17"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../eval && uv run ruff format --check . ../eval
      - name: Type check
        run: uv run mypy && uv run mypy ../eval
      - name: Tests
        run: uv run pytest -q
      - name: OpenAPI schema is exported cleanly
        run: uv run python -m app.export_openapi openapi.json
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: openapi
          path: backend/openapi.json

  frontend:
    name: Frontend (lint, types, unit tests, build)
    runs-on: ubuntu-24.04
    needs: backend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          name: openapi
          path: backend
      - name: Generated API client is up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
