# Autonomy tiers and guardrails. Enforced in code by app/services/action_policy.py.
tier2_limits:
  # "Reschedule vendors (within 48h)" in the PDF is read as: a shift of at most 48 hours.
  max_reschedule_shift_hours: 48
  # Accept a negotiated price change only if |new - old| / old <= this fraction.
  max_price_change_fraction: 0.05

token_budget:
  monthly_tokens_per_user: 1000000
  warn_fraction: 0.80
  throttle_fraction: 1.00

messaging:
  timezone: Asia/Kolkata
  quiet_hours_start: "21:00"
  quiet_hours_end: "09:00"

reminders:
  days_without_reply: 3
  max_reminders: 3

budget:
  alert_threshold_fraction: 0.90

outbox:
  max_attempts: 6
  base_backoff_seconds: 2
  max_backoff_seconds: 600

agents:
  # Below this confidence an agent escalates to a human approval request instead of acting.
  min_confidence: 0.70
